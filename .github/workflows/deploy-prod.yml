name: Deploy prod


on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}

jobs:
  deploy:
    name: Deploy to yorimichi-prod
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.DEPLOY_PROD_PAUSED != 'true'
    permissions:
      contents: read
      actions: read # 現在mainのCI run / attemptを読み取る
      pull-requests: read
      id-token: write # OIDC (Workload Identity Federation) 用
    concurrency:
      group: apphosting-deploy-prod
      cancel-in-progress: false
    env:
      GCP_PROJECT_ID: df-2026-t184-prod
      GCP_REGION: asia-east1
      BACKEND_ID: yorimichi-prod
      EXPECTED_ENV: prod
      EXPECTED_SA: yorimichi-prod@df-2026-t184-prod.iam.gserviceaccount.com
      FIREBASE_TOOLS_VERSION: "15.35.0"
      API_BASE: https://firebaseapphosting.googleapis.com/v1beta/projects/df-2026-t184-prod/locations/asia-east1/backends/yorimichi-prod
    steps:
      - name: Checkout trusted deployment controls
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Resolve current deploy candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ENV: prod
        run: python3 trusted/scripts/check-deploy-candidate.py

      # イベントSHAではなく、ロック取得後に再解決した現在のmain SHAをcheckoutする。
      - name: Checkout selected commit
        if: steps.candidate.outputs.deployable == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          persist-credentials: false
          path: source

      - name: Set up Node.js
        if: steps.candidate.outputs.deployable == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare fixed deployment configuration
        if: steps.candidate.outputs.deployable == 'true'
        env:
          DEPLOY_ENV: prod
        run: python3 trusted/scripts/prepare-deploy-source.py trusted source

      - name: Install firebase-tools
        if: steps.candidate.outputs.deployable == 'true'
        run: npm install -g "firebase-tools@${FIREBASE_TOOLS_VERSION}"

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: steps.candidate.outputs.deployable == 'true'
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_PROD }}
          service_account: ${{ vars.GCP_DEPLOY_SA_PROD }}
          create_credentials_file: true
          export_environment_variables: true
          token_format: access_token

      - name: Verify backend identity
        if: steps.candidate.outputs.deployable == 'true'
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          backend=$(curl -sfS -H "Authorization: Bearer ${GCP_ACCESS_TOKEN}" "${API_BASE}")
          env_name=$(jq -r '.environment' <<<"${backend}")
          if [ "${env_name}" != "${EXPECTED_ENV}" ]; then
            echo "::error::backend ${BACKEND_ID} has environment '${env_name}', expected '${EXPECTED_ENV}'"
            exit 1
          fi
          sa=$(jq -r '.serviceAccount' <<<"${backend}")
          if [ "${sa}" != "${EXPECTED_SA}" ]; then
            echo "::error::backend ${BACKEND_ID} runs as '${sa}', expected '${EXPECTED_SA}'"
            exit 1
          fi
          uri=$(jq -r '.uri' <<<"${backend}")
          echo "BACKEND_URI=${uri}" >> "$GITHUB_ENV"
          echo "backend ${BACKEND_ID} (env=${env_name}, sa=${sa}) uri=${uri}"

      - name: Wait for in-flight rollouts
        if: steps.candidate.outputs.deployable == 'true'
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 trusted/scripts/apphosting-rollouts.py wait

      - name: Record job start time
        if: steps.candidate.outputs.deployable == 'true'
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      # main が待機中に進んだ場合は同じ選定を維持できないので skip する。
      # 新しい main はそれ自身の CI workflow_run で別ジョブがデプロイする。
      - name: Re-resolve candidate before deploying
        id: recheck
        if: steps.candidate.outputs.deployable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ENV: prod
          EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
        run: python3 trusted/scripts/check-deploy-candidate.py

      - name: Deploy
        if: steps.candidate.outputs.deployable == 'true' && steps.recheck.outputs.deployable == 'true'
        working-directory: source
        run: >-
          firebase deploy
          --only "apphosting:${BACKEND_ID}"
          --project "${GCP_PROJECT_ID}"
          --non-interactive
          --force

      - name: Verify rollout succeeded
        if: steps.candidate.outputs.deployable == 'true' && steps.recheck.outputs.deployable == 'true'
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python3 trusted/scripts/apphosting-rollouts.py verify

      - name: Smoke check
        if: steps.candidate.outputs.deployable == 'true' && steps.recheck.outputs.deployable == 'true'
        run: |
          code=000
          for _ in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${BACKEND_URI}" || true)
            case "${code}" in 2*|3*) break;; esac
            sleep 5
          done
          case "${code}" in
            2*|3*) echo "https://${BACKEND_URI} -> HTTP ${code}";;
            *) echo "::error::https://${BACKEND_URI} returned HTTP ${code}"; exit 1;;
          esac
